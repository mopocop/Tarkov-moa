# Squad relay + Tailscale Funnel — deployed on the home server (OptiPlex).
#
# Public URL: https://tarkovmoa.<tailnet>.ts.net  (wss:// for the squad socket).
# Two independent containers on a private Docker network: the Tailscale node
# "tarkovmoa" runs Funnel and reverse-proxies to the relay at relay:8787. The
# relay publishes NO host/LAN ports (internal-only). Decoupled lifecycles mean
# either can restart without orphaning the other. The home server's own
# Tailscale identity (moahomeserver) is untouched.
#
# Secrets live in .env (gitignored): TS_AUTHKEY, STATS_TOKEN.

services:
  # --- Tailscale node "tarkovmoa": userspace networking + Funnel ingress -------
  tailscale:
    image: tailscale/tailscale:v1.92.5
    hostname: tarkovmoa                  # → tarkovmoa.<tailnet>.ts.net
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale   # persisted → stable identity across restarts
      TS_USERSPACE: "true"               # no TUN device / NET_ADMIN needed
      TS_EXTRA_ARGS: --advertise-tags=tag:relay
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve-config.json:/config/serve.json:ro
    depends_on:
      - relay
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- The relay: internal-only, reachable by the tailscale node as relay:8787 -
  relay:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    image: squad-relay:latest
    expose:
      - "8787"                           # internal docker network only — no host/LAN port
    environment:
      PORT: "8787"
      STATS_TOKEN: ${STATS_TOKEN:-}
      FEEDBACK_FILE: /data/feedback.jsonl
    volumes:
      - relay-data:/data
    read_only: true                      # immutable rootfs
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  ts-state:
  relay-data:
