name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client:
    name: Client — type-check, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build        # tsc -b (type-check) + vite build — REQUIRED
      - run: npx vitest run       # unit tests — REQUIRED
      - run: npm run lint         # eslint — REQUIRED (no errors allowed)

  server:
    name: Server — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx vitest run
        working-directory: server
