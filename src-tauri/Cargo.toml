[package]
name = "tarkov-companion"
version = "0.8.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
notify = "6"
regex = "1"
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = "s"
strip = true
