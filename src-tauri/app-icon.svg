<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tile" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#1d201a"/>
      <stop offset="100%" stop-color="#0a0b09"/>
    </radialGradient>
  </defs>
  <!-- Dark machined tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#tile)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="216" fill="none"
        stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>
  <!-- Brass reticle: ring + four cardinal ticks + center dot -->
  <g fill="none" stroke="#c9a86a" stroke-width="38" stroke-linecap="round">
    <circle cx="512" cy="512" r="250"/>
    <line x1="512" y1="96"  x2="512" y2="232"/>
    <line x1="512" y1="792" x2="512" y2="928"/>
    <line x1="96"  y1="512" x2="232" y2="512"/>
    <line x1="792" y1="512" x2="928" y2="512"/>
  </g>
  <circle cx="512" cy="512" r="60" fill="#c9a86a"/>
</svg>
